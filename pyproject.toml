[project]
name = "mp3-title-editor"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "mutagen>=1.48.1",
    "wxpython>=4.3.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.15"
disallow_untyped_defs = true
